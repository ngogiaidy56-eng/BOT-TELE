<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liên Kết Tài Khoản Xem Live</title>
    <!-- THƯ VIỆN BẮT BUỘC CỦA TELEGRAM MINI APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: #1a1a2e; /* Màu nền tối */
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #16213e;
            padding: 25px;
            border-radius: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            color: #e94560;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a9a9a9;
            font-size: 14px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #303a52;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #00a8ff;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #0f4c75, #3282b8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3>▶ LIÊN KẾT TÀI KHOẢN</h3>
        </div>

        <div class="input-group">
            <label>👤 TÊN TÀI KHOẢN XEM LIVE</label>
            <input type="text" id="username" placeholder="Nhập username của bạn">
        </div>

        <button class="btn-submit" id="btnSubmit">XÁC NHẬN LIÊN KẾT</button>
    </div>

    <script>
        // Khởi tạo Telegram Web App và mở full màn hình
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Lắng nghe sự kiện bấm nút xác nhận
        document.getElementById('btnSubmit').addEventListener('click', function() {
            let u = document.getElementById('username').value.trim();

            // Kiểm tra nếu để trống
            if (!u) {
                tg.showAlert("Vui lòng nhập tên tài khoản xem live!");
                return;
            }

            // Đóng gói dữ liệu dạng chuỗi JSON
            let data = JSON.stringify({
                taikhoan: u
            });

            // Gửi dữ liệu về Telegram Bot và tự động đóng Mini App
            tg.sendData(data);
            tg.close();
        });
    </script>
</body>
</html>
